      /* ===== Ultra pass: cinematic + vibrant upgrade ===== */
      /* ===== iOS Safari zoom-on-focus prevention =====
         iOS auto-zooms the page when a tapped input's font-size is under
         16px. This is a permanent floor so it can never regress, even if
         a Tailwind text-sm class gets used on a form control later. */
      @media (max-width: 640px) {
        input,
        select,
        textarea {
          font-size: 16px !important;
        }
      }

      @keyframes kenburns {
        0% {
          transform: scale(1) translate3d(0, 0, 0);
        }
        100% {

        }
      }
      .kenburns {
        animation: kenburns 22s ease-in-out infinite alternate;
        will-change: transform;
      }
      .cinematic-grade {
        filter: saturate(1.18) contrast(1.07) brightness(0.97);
      }
      @keyframes shimmerSweep {
        0% {
          background-position: -150% 0;
        }
        100% {
          background-position: 250% 0;
        }
      }
      .shimmer-text {
        background-image: linear-gradient(
          100deg,
          #e3c572 0%,
          #e3c572 35%,
          #fff6dc 50%,
          #e3c572 65%,
          #e3c572 100%
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmerSweep 3.2s ease-in-out 0.5s 1;
      }
      .glow-pulse {
        transition:
          box-shadow 0.4s ease,
          transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .glow-pulse:hover {
        box-shadow:
          0 0 0 1px rgba(201, 164, 76, 0.5),
          0 10px 34px -8px rgba(201, 164, 76, 0.5);
        transform: translateY(-2px);
      }
      @media (prefers-reduced-motion: reduce) {
        .kenburns {
          animation: none;
        }
        .shimmer-text {
          animation: none;
          background: none;
          -webkit-text-fill-color: currentColor;
        }
        .glow-pulse:hover {
          transform: none;
        }
      }
